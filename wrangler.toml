# Cloudflare Pages project seduta-site. Run wrangler from this folder: it reads this file and ./functions.
# With this file, it (not the dashboard) holds the project's settings; the secret EUROUTER_MANAGEMENT_KEY is kept.
name = "seduta-site"
pages_build_output_dir = "."
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]   # @apple/app-store-server-library is written for Node

# Refunded subscriptions and the 60 s marker (README: Setup, step 3). Replace the id after `wrangler kv namespace create MINT`.
[[kv_namespaces]]
binding = "MINT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Waitlist addresses (README: Waitlist). Replace the id after `wrangler kv namespace create WAITLIST`.
[[kv_namespaces]]
binding = "WAITLIST"
id = "REPLACE_WITH_WAITLIST_KV_ID"
